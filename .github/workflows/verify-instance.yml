name: Verify EdgeEver instance

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: DNS check (notes.kkkkkong.top)
        run: |
          echo "== A record via 1.1.1.1 =="
          dig +short notes.kkkkkong.top @1.1.1.1
      - name: Health check (custom domain)
        run: curl -sS -w "\nHTTP %{http_code}\n" https://notes.kkkkkong.top/api/health
      - name: OpenAPI check (custom domain)
        run: |
          curl -sS -o openapi.json -w "HTTP %{http_code}\n" https://notes.kkkkkong.top/api/openapi.json
          wc -c openapi.json
