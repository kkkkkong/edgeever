name: Verify EdgeEver instance (one-off)

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify health, openapi and admin login
        env:
          BASE: https://edgeever.376634352.workers.dev
          PASSWORD: ${{ secrets.EDGE_EVER_VERIFY_PASSWORD }}
        run: |
          set -uo pipefail
          echo "== 1) GET /api/health =="
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$BASE/api/health")
          echo "HTTP $code"
          cat /tmp/health.json; echo

          echo "== 2) GET /api/openapi.json =="
          code2=$(curl -sS -o /tmp/openapi.json -w "%{http_code}" "$BASE/api/openapi.json")
          echo "HTTP $code2"
          python3 -c "import json;d=json.load(open('/tmp/openapi.json'));print('openapi:',d.get('openapi'),'| paths:',len(d.get('paths',{})))"

          echo "== 3) POST /api/v1/auth/login (admin) =="
          export PASSWORD
          code3=$(python3 -c "
import json,os,urllib.request
payload=json.dumps({'username':'admin','password':os.environ['PASSWORD']}).encode()
req=urllib.request.Request('$BASE/api/v1/auth/login',data=payload,headers={'Content-Type':'application/json'})
try:
    r=urllib.request.urlopen(req,timeout=30)
    print(r.status, r.read().decode()[:400])
except urllib.error.HTTPError as e:
    print(e.code, e.read().decode()[:400])
")
          echo "$code3"
